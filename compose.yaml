services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 5s
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obvc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_secret}
      POSTGRES_DB: ${POSTGRES_DB:-obvc_db}
    volumes:
      - local_postgres_data:/var/lib/postgressql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost://3000"]
      interval: 5s
      timeout : 5s
  
